# Force Node.js provider (not Deno)
# Railway auto-detects Deno because of supabase/functions/ — override that
providers = ["node"]

[phases.setup]
# postgresql: psql client needed for railway.json's deploy.preDeployCommand
# (npm run db:migrate -> scripts/setup-db.sh), which runs before the app starts.
nixPkgs = ["nodejs_22", "postgresql"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node dist/src/index.js"
