# Force Node.js provider (not Deno)
# Railway auto-detects Deno because of supabase/functions/ — override that
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node dist/src/index.js"
