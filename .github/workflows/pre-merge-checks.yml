name: Pre-merge checks

# T-012. Two mechanical gates that the four CI jobs do NOT cover, kept in their
# own workflow so they stay fast (no DB, no browsers, ~30s) and can be made a
# required check without waiting on the 7-minute Backend job.
#
#   1. DOC DRIFT — `verify:claude-md` counts route modules, migrations and YAML
#      bundles against the live filesystem, checks every `- `/path`` in Key
#      Directories exists, and checks every commit hash it cites is an ancestor
#      of main. CLAUDE.md is the file every agent and new contributor reads
#      first; when it drifts it does not fail loudly, it just starts lying.
#   2. PLAINTEXT SECRETS — `scripts/scan-secrets.ts`. A credential is in git
#      history the moment it is committed; removing the line later does not
#      un-leak it, only rotation does. The cheapest possible moment to catch one
#      is before the merge button.
#
# Deliberately NOT here: format/lint/typecheck/tests. Those live in ci.yml and
# duplicating them would double the runner cost for no extra signal.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Doc drift + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      # `tsx` is a root devDependency (added 2026-09-20). Before that it was NOT
      # one — every `npx tsx …` script relied on npx fetching it on demand,
      # which HUNG on a clean runner (npx asks "Ok to proceed?", no TTY, the
      # step sat until the job timeout) and later made three script tests flake
      # when the registry fetch was slow. `npm ci` above now installs it, so npx
      # resolves the local binary. NPM_CONFIG_YES stays as a belt-and-braces
      # guard so a future dependency-less `npx` can never prompt in CI again.
      # zero-vendor-alerts.yml still pins `npx --yes tsx@4.23.12` inline (it
      # runs without a full install).
      NPM_CONFIG_YES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # verify-claude-md resolves cited commit hashes against main, so a
          # shallow clone would make every hash look unmerged.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Both checks run even if the first fails, so one PR round-trip reports
      # both problems instead of revealing the second one only after the first
      # is fixed.
      - name: CLAUDE.md drift
        id: drift
        run: npm run verify:claude-md

      - name: Plaintext secret scan
        if: always() && steps.drift.conclusion != 'cancelled'
        run: npx tsx scripts/scan-secrets.ts

  # T-013 (2026-09-15). Prod DB migrations are NOT automated — Railway's
  # deploy pipeline deploys CODE on every merge to main, but someone has to
  # remember to separately run `npm run db:migrate` against prod. That step
  # got skipped across 3+ days of individually-merged PRs (2026-09-11 →
  # 09-15), leaving prod running without STRICT skill-map links, night-shift
  # coverage, and past-time/closed-day booking guards until caught by hand.
  #
  # A `railway.json` `preDeployCommand` was tried and reverted the same day:
  # it reuses Railway's own `DATABASE_URL`, which is the intentionally
  # restricted `app_user` role (no DDL rights, by design — see root
  # CLAUDE.md's RLS section) and fails on every deploy. Automating this
  # properly means either a second live prod credential in Railway's env-var
  # pool or loosening `app_user`'s privileges — both real security tradeoffs
  # not worth making to solve "someone forgot a manual step." A cheap
  # reminder solves the actual failure mode (a human forgot) with none of
  # that cost.
  migration-reminder:
    name: Migration reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # continue-on-error: this job is an informational nudge, never a gate.
      # gh's default token is read-only on a fork PR (and in some other
      # restricted contexts), which would make `gh pr comment` fail — that
      # must never turn a soft reminder into a hard required-check block.
      - name: Comment if this PR adds a migration
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 --quiet
          NEW_MIGRATIONS="$(git diff --name-only --diff-filter=A "origin/$BASE_REF"...HEAD -- supabase/migrations/ || true)"

          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migration files in this PR."
            exit 0
          fi

          echo "New migration file(s):"
          echo "$NEW_MIGRATIONS"

          MARKER="<!-- migration-reminder-bot -->"
          EXISTING="$(gh pr view "$PR_NUMBER" --json comments --jq ".comments[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)"
          if [ -n "$EXISTING" ]; then
            echo "Reminder already posted on this PR, not duplicating."
            exit 0
          fi

          FILE_LIST="$(echo "$NEW_MIGRATIONS" | sed 's/^/- `/; s/$/`/')"
          BODY="$(cat <<BODYEOF
          $MARKER
          ⚠️ **This PR adds a database migration.** Prod migrations are not automated — see \`docs/planning/RESOLVED.md\` (2026-09-15 entry) for why. After this merges, run \`npm run db:migrate\` against prod (\`scripts/setup-db.sh\`), or it will silently sit unapplied like the 10 that piled up 2026-09-11 → 09-15.

          $FILE_LIST
          BODYEOF
          )"
          gh pr comment "$PR_NUMBER" --body "$(echo "$BODY" | sed 's/^[[:space:]]*//')"
