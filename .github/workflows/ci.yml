name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (typecheck + tests + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Provision Postgres so DB-level integration tests run for real
      # instead of silently skipping. Without this service, ~524 tests
      # across 50 files under src/*.test.ts that gate on `dbAvailable`
      # from getRootClient() would always pass with zero assertions
      # executed. Belt-and-suspenders: the "Run backend tests" step sets
      # REQUIRE_DB_TESTS=1, which makes `skipIfDbDown` throw from beforeEach
      # instead of skipping, so even a container-up-but-unreachable
      # scenario fails CI loudly instead of producing a green run.
      postgres:
        # ankane/pgvector ships pgvector preinstalled. The first migration
        # (20260228000000_initial_schema.sql) does CREATE EXTENSION IF NOT
        # EXISTS vector, and 20260501000000 does CREATE EXTENSION btree_gist
        # (contrib, bundled). Vanilla postgres:16 silently failed on the
        # first one and `set -e` in scripts/setup-db.sh hid the error.
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed: the drift detector (verify:claude-md)
          # walks every commit SHA mentioned in CLAUDE.md and asserts
          # reachability from main. Default shallow clone (fetch-depth: 1)
          # strips historical SHAs and produces false "commit not
          # reachable" failures on every push.
          fetch-depth: 0

      # Docs-only PRs skip the heavy steps below (migrations/seed/tsc/tests).
      # The job still RUNS and reports success so the "Backend" required status
      # check is always satisfied — never skip the whole job, or branch
      # protection blocks the merge waiting for a check that never reports.
      # NB: the CLAUDE.md drift detector below is NOT gated — it validates docs,
      # so it must run on doc-only changes. Mirrors the e2e job's pattern.
      - name: Detect relevant changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'dashboard/**'
              - 'agent/**'
              - 'scripts/**'
              - 'supabase/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              # NB: do NOT append a negation like '!**/*.md' here. dorny/paths-filter
              # feeds this list to picomatch, where a negated pattern in an array
              # matches every file that ISN'T markdown — so '.gitignore', 'LICENSE'
              # and 'workflow.config.json' all matched `code` and ran the full
              # pipeline. The skip only ever worked for .md files. A .md inside a
              # code dir now triggers a run; that over-runs (safe) rather than
              # under-runs, and there is exactly one such file in the repo.

      # Make the skip/run decision visible in the log. `code` is '' on a push to
      # main (the filter step is PR-only), which the guards read as "not false"
      # => run. A filter malfunction therefore over-runs rather than silently
      # skipping the suite on a real code change.
      - name: Report change-detection decision
        run: |
          echo "event=${{ github.event_name }} code=${{ steps.changes.outputs.code }}"
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.changes.outputs.code }}" != "false" ]; then
            echo "==> running the full job"
          else
            echo "==> docs/config-only change: skipping heavy steps (check still reports success)"
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json

      - name: Install root + agent dependencies
        run: npm ci --no-audit --no-fund && (cd agent && npm ci --no-audit --no-fund --prefer-offline)

      # Migrations, seed data and question-tree templates are NOT applied to test_db here any more.
      # The test run builds them once into a template database (tests/setup/globalSetup.ts) and
      # clones one database per vitest worker from it, so no test uses test_db itself.

      - name: TypeScript check
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npx tsc --noEmit

      # NOT gated — the drift detector validates CLAUDE.md against the tree, so
      # it must run on docs-only PRs (that's exactly when a doc drifts).
      - name: Verify CLAUDE.md (drift detector — NEEDS-REFACTORING #13)
        run: npm run verify:claude-md

      # NOT gated either. supabase/seed.sql and the starter-services migration
      # are GENERATED from shared/starterServices.ts; a hand-edit to the SQL
      # silently becomes a second source of truth, which is the exact drift that
      # left example_services empty for all 31 business types. Fail loudly here.
      - name: Verify generated starter-service SQL matches shared/starterServices.ts
        run: npm run verify:starter-services

      - name: Run backend tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npm test
        env:
          # Refuses to silent-skip DB-dependent tests. If the postgres
          # service above is unreachable for any reason, skipIfDbDown
          # throws from beforeEach instead of skipping, so CI fails the
          # build instead of reporting a green run that exercised half
          # the suite. Helper lives in src/test-utils.ts.
          REQUIRE_DB_TESTS: '1'
          # rlsIsolation.test.ts connects TWICE: as a privileged role to seed
          # fixtures, and as the non-bypassing app_user to prove the policies
          # actually filter. Its defaults point at the local `postgres`
          # database; CI's service container builds `test_db` and leaves
          # `postgres` empty, so without these the RLS suite would run against
          # a schema-less database. app_user itself is created by
          # 20260724000100_app_user_role.sql, which the "Apply migrations" step
          # above runs — with the placeholder password that migration documents
          # as local/CI-only (production sets a real one out of band).
          TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5433/test_db
          TEST_APP_USER_DATABASE_URL: postgres://app_user:app_user@localhost:5433/test_db

  dashboard:
    name: Dashboard (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docs-only PRs skip install/tsc/tests; the job still reports success so
      # the "Dashboard" required check is satisfied (see the backend job note).
      - name: Detect relevant changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'dashboard/**'
              - 'agent/**'
              - 'scripts/**'
              - 'supabase/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              # NB: do NOT append a negation like '!**/*.md' here. dorny/paths-filter
              # feeds this list to picomatch, where a negated pattern in an array
              # matches every file that ISN'T markdown — so '.gitignore', 'LICENSE'
              # and 'workflow.config.json' all matched `code` and ran the full
              # pipeline. The skip only ever worked for .md files. A .md inside a
              # code dir now triggers a run; that over-runs (safe) rather than
              # under-runs, and there is exactly one such file in the repo.

      # Make the skip/run decision visible in the log. `code` is '' on a push to
      # main (the filter step is PR-only), which the guards read as "not false"
      # => run. A filter malfunction therefore over-runs rather than silently
      # skipping the suite on a real code change.
      - name: Report change-detection decision
        run: |
          echo "event=${{ github.event_name }} code=${{ steps.changes.outputs.code }}"
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.changes.outputs.code }}" != "false" ]; then
            echo "==> running the full job"
          else
            echo "==> docs/config-only change: skipping heavy steps (check still reports success)"
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npx tsc --noEmit

      - name: Run dashboard tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npm test

  agent:
    name: Agent (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docs-only PRs skip install/tsc/tests; the job still reports success so
      # the "Agent" required check is satisfied (see the backend job note).
      - name: Detect relevant changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'dashboard/**'
              - 'agent/**'
              - 'scripts/**'
              - 'supabase/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              # NB: do NOT append a negation like '!**/*.md' here. dorny/paths-filter
              # feeds this list to picomatch, where a negated pattern in an array
              # matches every file that ISN'T markdown — so '.gitignore', 'LICENSE'
              # and 'workflow.config.json' all matched `code` and ran the full
              # pipeline. The skip only ever worked for .md files. A .md inside a
              # code dir now triggers a run; that over-runs (safe) rather than
              # under-runs, and there is exactly one such file in the repo.

      # Make the skip/run decision visible in the log. `code` is '' on a push to
      # main (the filter step is PR-only), which the guards read as "not false"
      # => run. A filter malfunction therefore over-runs rather than silently
      # skipping the suite on a real code change.
      - name: Report change-detection decision
        run: |
          echo "event=${{ github.event_name }} code=${{ steps.changes.outputs.code }}"
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.changes.outputs.code }}" != "false" ]; then
            echo "==> running the full job"
          else
            echo "==> docs/config-only change: skipping heavy steps (check still reports success)"
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npm ci --no-audit --no-fund

      # The agent worker (prompt, toolsClient, tools, sessionContext, tenant
      # config, fallback) had ZERO CI coverage before 2026-05-21 — its tsc +
      # vitest suite ran only locally. A prompt or tool-contract regression
      # (e.g. dropping the infrastructure-error guidance) could ship unseen.
      - name: TypeScript check
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npx tsc --noEmit

      - name: Run agent tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npm test

  # E2E is split into 4 parallel shards. The shard jobs are NOT the required check: the `e2e` job at
  # the bottom of this file keeps the required name "E2E (Playwright)" and only passes when every
  # shard passed AND every test in the full list ran in exactly one shard.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every shard must report, so one failing shard never hides what the others found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect whether this change can affect the E2E result. A docs-/config-only
      # PR skips the heavy steps below (the job still RUNS and reports success, so
      # the "E2E (Playwright)" required status check is always satisfied — never
      # skip the whole job/workflow, or branch protection would block the merge
      # waiting for a check that never reports). Pushes to main always run the
      # full suite (the `!= pull_request` clause on each guard below).
      - name: Detect relevant changes
        # PR-only: on pushes to main the heavy steps always run (the
        # `!= pull_request` clause on each guard), so the filter — which would
        # need non-shallow history to diff a push — never has to run here.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'dashboard/**'
              - 'agent/**'
              - 'scripts/**'
              - 'supabase/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              # NB: do NOT append a negation like '!**/*.md' here. dorny/paths-filter
              # feeds this list to picomatch, where a negated pattern in an array
              # matches every file that ISN'T markdown — so '.gitignore', 'LICENSE'
              # and 'workflow.config.json' all matched `code` and ran the full
              # pipeline. The skip only ever worked for .md files. A .md inside a
              # code dir now triggers a run; that over-runs (safe) rather than
              # under-runs, and there is exactly one such file in the repo.

      # Make the skip/run decision visible in the log. `code` is '' on a push to
      # main (the filter step is PR-only), which the guards read as "not false"
      # => run. A filter malfunction therefore over-runs rather than silently
      # skipping the suite on a real code change.
      - name: Report change-detection decision
        run: |
          echo "event=${{ github.event_name }} code=${{ steps.changes.outputs.code }}"
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.changes.outputs.code }}" != "false" ]; then
            echo "==> running the full job"
          else
            echo "==> docs/config-only change: skipping heavy steps (check still reports success)"
          fi

      - name: Set up Node.js 22
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            agent/package-lock.json

      # Cache the downloaded browser binaries so `playwright install` is a no-op
      # on a hit (saves the ~30-60s Chromium download every run).
      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}

      # Cache Next.js's incremental build cache to speed up `next build`.
      - name: Cache Next.js build
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        uses: actions/cache@v4
        with:
          path: dashboard/.next/cache
          # Key on the dashboard source hash (not github.sha): a real cache HIT
          # when source is unchanged, a new entry only when it changes — avoids
          # writing a fresh cache every single commit.
          key: nextbuild-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-${{ hashFiles('dashboard/**/*.js', 'dashboard/**/*.jsx', 'dashboard/**/*.ts', 'dashboard/**/*.tsx') }}
          restore-keys: |
            nextbuild-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}-

      - name: Install root + dashboard + agent dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npm ci --no-audit --no-fund --prefer-offline && (cd dashboard && npm ci --no-audit --no-fund --prefer-offline) && (cd agent && npm ci --no-audit --no-fund --prefer-offline)

      - name: Apply migrations and seed
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: bash scripts/setup-db.sh && bash scripts/seed-db.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/test_db

      - name: Build backend
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: npm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/test_db
          JWT_SECRET: ci-test-secret
          OPENAI_API_KEY: sk-dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          AGENT_SECRET: ci-agent-secret

      - name: Start backend
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: node dist/src/index.js > /tmp/backend.log 2>&1 &
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/test_db
          JWT_SECRET: ci-test-secret
          OPENAI_API_KEY: sk-dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          AGENT_SECRET: ci-agent-secret
          PORT: 4001
          # Lets the import-website E2E exercise the real resolver → staging path
          # with canned extraction (no live OpenAI; CI's key is sk-dummy).
          KNOWLEDGE_IMPORT_E2E_STUB: '1'
          # Lets GoLivePanel E2E specs exercise the real activate state-machine
          # + DB update path with no Telnyx account configured. Also makes
          # /provisioning/activate "configured" (past the telnyx-null 503
          # guard) with zero real credentials.
          PROVISIONING_E2E_STUB: '1'
          # Buying a number now requires a started subscription (card-required
          # trial). Fixture mode lets the Go Live specs start one via
          # POST /billing/checkout without Stripe. Ignored when NODE_ENV=production.
          STRIPE_FIXTURE_MODE: 'true'
          # Self-serve /register is CLOSED unless ENABLE_SIGNUP=true (closed in
          # production until launch). E2E registers fresh tenants, so open it here.
          ENABLE_SIGNUP: 'true'
          # Browser caller pickup spec exercises the page + backend route in CI,
          # but runners do not have LiveKit credentials. This opt-in backend stub
          # returns deterministic session metadata so the page can execute the
          # observable call lifecycle without external voice infra.
          BROWSER_CALLER_E2E_STUB: '1'
          # Serve plain HTTP — wait-on, the dashboard, and Playwright all hit
          # http://localhost:4001. Without this the backend boots HTTPS with a
          # self-signed cert and every probe/request fails the TLS handshake.
          USE_HTTPS: 'false'

      - name: Build dashboard
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: cd dashboard && npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4001

      - name: Start dashboard
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: cd dashboard && npm run start > /tmp/dashboard.log 2>&1 &
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4001
          PORT: 4400

      - name: Wait for servers
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: |
          npx wait-on http://localhost:4001/health http://localhost:4400 --timeout 60000

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        # Browser binaries are cached above; `--with-deps` can spend the whole
        # job budget re-running heavyweight apt setup on GitHub runners before a
        # single spec executes. We need the browsers, not repeated OS package
        # surgery.
        run: cd dashboard && npx playwright install chromium

      - name: Run Playwright E2E
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        # Records the FULL unsharded list first, then runs this shard. Same step, same env, so the
        # list can never differ from what the shard ran (specs read env vars at collection time).
        # Playwright includes the login `setup` project in every shard, so each shard has its
        # own saved login. `list` prints per-test timings; `json` feeds the accounting below.
        run: |
          mkdir -p /tmp/e2e
          cd dashboard
          PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/e2e/list.json npx playwright test --list --reporter=json > /dev/null
          PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/e2e/results.json npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list,json
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/test_db
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4001
          # globalSetup pings BACKEND_URL/health for the freshness check; it
          # defaults to https://localhost:4001, but the CI backend is plain
          # HTTP (USE_HTTPS=false), so point it at http or the check fails.
          BACKEND_URL: http://localhost:4001
          # Several specs call /agent-tools/* directly with x-agent-secret;
          # must match the value the backend was started with.
          AGENT_SECRET: ci-agent-secret
          # workflows.spec.ts signs self-service (cancel/reschedule) tokens itself
          # with JWT_SECRET; must match the backend's value or verifySelfServiceToken
          # rejects them (400) and the public-page success states never render.
          JWT_SECRET: ci-test-secret
          # Dashboard runs `next start` (HTTP) in CI; the Playwright baseURL
          # defaults to https for local dev, so override it here.
          DASHBOARD_URL: http://localhost:4400
          # Run the test process in the seed tenants' timezone. Specs derive
          # datetime-local wall-clock strings from Node's tz (getTimezoneOffset)
          # while the browser reads them in timezoneId=America/Chicago. Locally
          # Node is already Chicago (where these tests were authored + pass); CI
          # Node defaults to UTC, so without this the two disagree by 5h and
          # UI bookings land at the wrong time (no overlap / outside shift).
          TZ: America/Chicago
          # The "Apply migrations and seed" step already built test_db via the
          # full migration chain. Do NOT let globalSetup rebuild-db.sh run: it
          # DROP SCHEMA CASCADEs out from under the already-running backend
          # (→ "relation users does not exist" on /login), and it rebuilds from
          # the stale baseline.sql snapshot that lacks recent migrations
          # (e.g. the tts_* columns).
          PLAYWRIGHT_SKIP_DB_RESET: '1'
          # Must match the backend's value so the import-website stub test runs
          # (the test skip-guard reads this from the Playwright process) instead
          # of skipping.
          KNOWLEDGE_IMPORT_E2E_STUB: '1'
          BROWSER_CALLER_E2E_STUB: '1'

      - name: Run simulate tools (agent-tools journey as regression guard)
        # Once per run, not once per shard.
        if: (github.event_name != 'pull_request' || steps.changes.outputs.code != 'false') && matrix.shard == 1
        # Runs the realistic booking + recall journey against the live servers
        # in this job. Flags [dev] gaps the same way `simulate.sh tools` does
        # locally. Non-zero exit will fail the job (like other steps).
        run: ./scripts/simulate.sh tools --env local
        env:
          BACKEND_URL: http://localhost:4001
          # simulate.sh reads agent secret via env_get (from .env) with
          # SIM_AGENT_SECRET as override — AGENT_SECRET alone is ignored.
          SIM_AGENT_SECRET: ci-agent-secret
          # simulate tools hits /demo/start which may use OPENAI for embeddings
          # in some paths; dummy is tolerated (falls back or skips).
          OPENAI_API_KEY: sk-dummy

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          # test-results/ holds the per-test screenshot + error-context.md
          # (the page's accessibility snapshot at the moment of failure) —
          # the only way to see WHY a headless CI test failed.
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Inputs for the accounting in the `e2e` job: the full test list and this shard's results.
      - name: Upload this shard's list and results
        if: always() && (github.event_name != 'pull_request' || steps.changes.outputs.code != 'false')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: /tmp/e2e/
          retention-days: 7
          if-no-files-found: warn

  # The REQUIRED check ("E2E (Playwright)" in branch protection). Always runs, so a failed or
  # cancelled shard fails this check instead of leaving it skipped (a skipped required check counts
  # as passing). On a code change it also proves the split lost nothing.
  e2e:
    name: E2E (Playwright)
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same filter as the shard jobs: a docs-only PR skips the shards' heavy steps, so there is
      # nothing to account for. Pushes to main always account.
      - name: Detect relevant changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'dashboard/**'
              - 'agent/**'
              - 'scripts/**'
              - 'supabase/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              # NB: do NOT append a negation like '!**/*.md' here. dorny/paths-filter
              # feeds this list to picomatch, where a negated pattern in an array
              # matches every file that ISN'T markdown — so '.gitignore', 'LICENSE'
              # and 'workflow.config.json' all matched `code` and ran the full
              # pipeline. The skip only ever worked for .md files. A .md inside a
              # code dir now triggers a run; that over-runs (safe) rather than
              # under-runs, and there is exactly one such file in the repo.

      - name: Every shard must have passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::E2E shards did not all pass (result: ${{ needs.e2e-shard.result }})"
            exit 1
          fi

      - name: Download shard lists and results
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: e2e-artifacts

      - name: Verify no E2E test was lost or run twice
        if: github.event_name != 'pull_request' || steps.changes.outputs.code != 'false'
        run: node scripts/verify-e2e-shards.mjs e2e-artifacts 4
